# Alembic 설정. DB URL 은 여기 두지 않고 앱 설정(DATABASE_URL)에서 읽는다 (migrations/env.py).
#
#   make db-revision m="add foo"   # 모델 변경 → 마이그레이션 파일 자동 생성
#   make db-upgrade                # 최신으로 적용 (앱 시작 시에도 자동 적용)
#   make db-check                  # 모델과 마이그레이션이 어긋났는지 검사

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# 파일명: 날짜_리비전_설명.py (목록에서 순서대로 보이도록)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# 생성된 마이그레이션 파일을 ruff 로 정리
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = %(here)s/.venv/bin/ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
