[project]
name = "agent-backend"
version = "0.1.0"
description = "FastAPI + LangGraph agent backend (SSE streaming)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "langgraph>=1.2.23",
    "langchain-core>=1.8.3",
    "langchain-anthropic>=1.7.11",
    "langchain-ollama>=1.1.0",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary,pool]>=3.3.9",
    "langfuse>=5.2.0",
    "tzdata>=2026.6",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "alembic>=1.20.1",
    "anyio>=4.16.0",
    "trafilatura>=2.3.1",
    "langchain-google-genai>=4.4.3",
    "langchain-openai>=1.7.4",
    "boto3>=1.43.125",
    "xberg>=1.3.9",
    "python-multipart>=0.0.33",
    # Google 로그인 ID 토큰 검증 (langchain-google-genai 가 이미 쓰는 버전)
    "google-auth>=2.62.1",
    "requests>=2.34.2",
    "pgvector>=0.5.1",
    "pypdfium2>=5.14.0",
    # DOCX 수정: ZIP 안의 XML 을 직접 고친다 (2026-11-24, 이미 trafilatura 를 따라 들어와 있던 버전)
    "lxml>=6.1.3",
    # 새 DOCX 만들기: Markdown 읽기 (2026-11-24, 이미 rich 를 따라 들어와 있던 버전. MIT)
    "markdown-it-py>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.6",
    # 계층 간 import 방향 검사 (make lint, 아래 [tool.importlinter])
    "import-linter>=2.15",
]

[tool.uv]
package = false
# 갓 나온 버전은 공급망 공격이 숨어 있어도 아직 발견되지 않았을 수 있어서, 추가할 때 2주 이상 지난 버전으로 묶는다.
# (2026-11-19 trafilatura 추가 시 하위 의존성 중 2주가 안 된 버전)
constraint-dependencies = [
    "courlan<1.5.0",
    # (2026-11-20 langchain-google-genai 추가 시)
    "google-auth<2.62.2",
    "google-genai<3.0.0",
    "langchain-google-genai<4.5.0",
    # (2026-11-20 langchain-openai 추가 시)
    "langchain-openai<1.8.0",
    "openai<3.47.0",
    "dateparser<1.5.1",
    "regex<2026.11.1",
    # (2026-11-20 boto3 추가 시)
    "boto3<1.43.126",
    "botocore<1.43.126",
    # (2026-11-20 문서 파싱·업로드 추가 시. xberg 1.4.x 는 PyPI 가 아닌 별도 저장소에만 있다)
    "xberg<1.3.10",
    "python-multipart<0.0.34",
    # (2026-11-20 import-linter 추가 시)
    "import-linter<2.16",
    "grimp<3.19",
    "markdown-it-py<4.3.0",
    # (2026-11-20 프로젝트 문서 검색(pgvector) 추가 시)
    "pgvector<0.5.2",
    # (2026-11-20 PDF 텍스트 레이어를 pypdfium2 로 뽑을 때. 5.15.x 는 11-09 출시)
    "pypdfium2<5.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# D: docstring 검사 (Google Style, CLAUDE.md 참고)
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# 테스트 함수는 이름이 곧 설명이라 docstring 을 강제하지 않는다 (쓰면 Google Style 로).
"tests/**" = ["D1"]
# Alembic 이 자동 생성하는 마이그레이션 파일
"migrations/versions/**" = ["D"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

# 계층 간 import 방향 검사 (make lint). 위 계층은 아래 계층을 import 할 수 있지만 반대는 안 된다.
# 같은 줄에 ":" 로 묶은 패키지는 같은 계층이라 서로 import 해도 된다.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "계층 의존 방향"
type = "layers"
layers = [
    "app.main",
    "app.api",
    "app.conversations",
    "app.agents",
    "app.orchestration",
    "app.tools",
    "app.projects : app.documents : app.web : app.auth : app.images : app.memory",
    "app.llm : app.prompts",
    "app.models",
    "app.core",
]
