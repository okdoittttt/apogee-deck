[project]
name = "agent-backend"
version = "0.1.0"
description = "FastAPI + LangGraph agent backend (SSE streaming)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "langgraph>=1.2.23",
    "langchain-core>=1.8.3",
    "langchain-anthropic>=1.7.11",
    "langchain-ollama>=1.1.0",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary,pool]>=3.3.9",
    "langfuse>=5.2.0",
    "tzdata>=2026.6",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "alembic>=1.20.1",
    "anyio>=4.16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# D: docstring 검사 (Google Style, CLAUDE.md 참고)
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# 테스트 함수는 이름이 곧 설명이라 docstring 을 강제하지 않는다 (쓰면 Google Style 로).
"tests/**" = ["D1"]
# Alembic 이 자동 생성하는 마이그레이션 파일
"migrations/versions/**" = ["D"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
