services:
  frontend:
    build:
      context: ./frontend
      args:
        # 브라우저가 직접 호출하는 백엔드 주소 (빌드 시점에 고정됨)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-8000}}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"  # 기본은 이 Mac 에서만 접속 (BIND_HOST 참고)
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres:5432/${POSTGRES_DB:-agent}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000}}
      # 로그인: 끝나면 돌아갈 화면 주소, Google 콜백 주소를 만들 백엔드 주소 (브라우저 기준)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:${BACKEND_PORT:-8000}}
      # Langfuse 가 같은 compose 프로젝트에 있으면 내부 주소로 전송
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
      # 프롬프트 동기화 시 Langfuse 버전에 기록할 커밋 (컨테이너엔 .git 이 없음)
      # `make up` / `make backend` 가 자동으로 채운다.
      GIT_COMMIT: ${GIT_COMMIT:-}
      # 첨부 파일 저장소 (앱 전용 MinIO, S3 API)
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-agent}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-agent-minio-secret}
    extra_hosts:
      # 호스트에서 실행 중인 Ollama / mlx-lm 에 접근 (Linux 에서도 동일 주소 사용)
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"  # 기본은 이 Mac 에서만 접속 (BIND_HOST 참고)
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    # postgres:17-alpine + pgvector (docker/postgres/Dockerfile)
    build: ./docker/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"  # 이 Mac 에서만 접속
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 첨부 파일 저장소. Langfuse 용 MinIO 와 계정·볼륨을 나눠서, Langfuse 없이도 동작하고
  # Langfuse 를 초기화해도 첨부 원본이 지워지지 않게 한다. 버킷과 보관 기간 규칙은 백엔드가 만든다.
  minio:
    image: cgr.dev/chainguard/minio
    command: server --address ":9000" --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agent}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-agent-minio-secret}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9100}:9000"          # S3 API, 이 Mac 에서만 접속
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001"  # 웹 콘솔
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  # 세션/캐시/큐 용도로 이후에 사용. 기본 실행에는 포함되지 않음:
  #   docker compose --profile cache up
  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    ports:
      - "127.0.0.1:6379:6379"  # 이 Mac 에서만 접속
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:
